name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-library:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore library solution
        run: dotnet restore src/Plugin.Maui.HexGrid.sln

      - name: Build library solution
        run: dotnet build src/Plugin.Maui.HexGrid.sln --configuration Release --no-restore

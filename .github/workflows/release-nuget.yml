name: release-nuget

on:
  push:
    tags:
      - v*.*.*
      - v*.*.*-*

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore src/Plugin.Maui.HexGrid.sln

      - name: Pack
        run: dotnet pack src/Plugin.Maui.HexGrid/Plugin.Maui.HexGrid.csproj --configuration Release --no-restore -o ./artifacts

      - name: Push package
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
